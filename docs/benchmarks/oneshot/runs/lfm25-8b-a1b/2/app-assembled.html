<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ecosystem Lab</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; display:flex; height:100vh; overflow:hidden;}
    #panel-world {flex:1; overflow:auto; position:fixed; top:0; left:0; width:calc(100% - width(700px)); background:#f0f0f0;}
    #panel-side {flex:1; overflow:auto; position:fixed; top:0; right:0; background:#fff; border:1px solid #ccc; height:calc(100% - height(700px)); display:flex; flex-direction:column; padding:10px;}
    canvas {background:#fff; display:flex; align-items:center; justify-content:center; flex-grow:0;}
    .controls {background:#222; color:#fff; padding:10px; display:flex; flex-direction:column; gap:5px; height:80px;}
    button, select {padding:5px; cursor:pointer;}
    input {padding:5px; width:100%; box-sizing:border-box;}
    #announcer {position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:#fff; padding:5px; min-height:1.5em; font-size:1.2em;}
    .grid {display:grid; grid-template-columns: repeat(var(--width),1fr); gap:1px;}
    .cell {background:#fff; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; font-size:0.8em;}
    .rabbit {width:8px; height:8px; background:rgb(240,240,240); border-radius:50%; margin:4px;}
    .fox {width:6px; height:6px; background:rgb(220,80,20); border-radius:50%; margin:4px;}
    .chart {flex:1; padding:10px; overflow:auto; background:#fafafa;}
    .chart svg {width:100%; height:200px;}
  </style>
</head>
<body>
  <div id="panel-world">
    <canvas id="worldCanvas" data-testid="canvas"></canvas>
  </div>
  <div id="panel-side">
    <div id="controls" class="controls">
      <button data-testid="play">Play</button>
      <button data-testid="pause">Pause</button>
      <button data-testid="step">Step</button>
      <button data-testid="reset">Reset</button>
      <label for="seed">Seed: <span id="seedVal"></span></label>
      <input type="range" id="speed" min="1" max="60" value="10">
      <label for="param-rabbits0">Rabbits0: <span id="rabbitVal"></span></label>
      <input type="range" id="param-foxes0" min="0" max="60" value="12">
      <input type="range" id="param-rabbitBreed" min="2" max="40" value="2">
      <input type="range" id="param-foxBreed" min="2" max="60" value="2">
      <label for="param-foxGain">FoxGain: <span id="foxGainVal"></span></label>
      <input type="range" id="param-grassMax" min="1" max="10" value="4">
      <label for="seedVal"></label>
    </div>
    <div id="chart"></div>
    <div id="ode-chart"></div>
    <div id="preset-list"></div>
    <div id="scenario-tools">

      <button id="preset-list">Presets</button>
      <div id="scenario-error" class="error" style="color:red;"></div>
    </div>
