<meta charset="utf-8">
<title>Ecosystem Lab</title>
<style>
  :root {
    --bg: #f5f5f0;
    --panel: #ffffff;
    --border: #ccc;
    --text: #222;
    --accent: #4a90d9;
    --accent-hover: #357abd;
    --danger: #d9534f;
    --success: #5cb85c;
    --focus: #4a90d9;
    --focus-ring: 2px solid var(--focus);
    --focus-ring-offset: 2px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
  }
  h1, h2, h3 { margin: 0 0 8px; font-weight: 600; }
  h1 { font-size: 24px; margin-bottom: 16px; }
  h2 { font-size: 18px; margin-bottom: 12px; }
  h3 { font-size: 15px; margin-bottom: 8px; }
  .hidden { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .layout {
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .layout.wide { flex-direction: row; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 8px;
    flex: 1;
    display: flex; flex-direction: column;
  }
  .panel-world { flex: 1; min-width: 360px; }
  .panel-side { flex: 1; min-width: 360px; }
  .panel-side.wide { flex-direction: row; }
  .panel-side.narrow { flex-direction: column; }
  .panel-side.wide .panel { flex: 1; min-width: 0; }
  .panel-side.narrow .panel { flex: 1; min-width: 0; }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .panel-header h2 { flex: 1; }
  .panel-header .actions { display: flex; gap: 4px; }
  .panel-header .actions button { padding: 2px 6px; font-size: 12px; }
  .panel-content { flex: 1; display: flex; flex-direction: column; gap: 8px; }
