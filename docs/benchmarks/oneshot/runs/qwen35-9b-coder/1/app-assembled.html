<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ecosystem Lab</title>
<style>
  :root {
    --bg: #f5f5f0;
    --fg: #222;
    --panel-bg: #fff;
    --border: #ccc;
    --accent: #333;
    --accent-hover: #555;
    --grass-base: #1e301e;
    --rabbit: #f0f0f0;
    --fox: #dc5014;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    overflow: hidden;
  }
  h1 { font-size: 1.1rem; margin: 0 0 0.5rem 0; }
  h2 { font-size: 1rem; margin: 0 0 0.3rem 0; }
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 8px;
    gap: 8px;
  }
  .top {
    display: flex;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }
  .panel-world {
    flex: 1;
    min-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .panel-side {
    flex: 1;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .world-inner {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }
  .canvas-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #e0e0e0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 4px 0;
  }
  .controls button, .controls input, .controls select {
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel-bg);
    color: var(--fg);
    cursor: pointer;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .controls button:hover, .controls button:focus {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .controls button:focus {
    outline-color: #0066cc;
    outline-style: solid;
    outline-width: 2px;
    outline-offset: 0;
  }
  .controls input[type="number"] {
    width: 60px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel-bg);
    color: var(--fg);
    font-size: 0.85rem;
    text-align: center;
  }
  .controls input[type="range"] {
    width: 100px;
  }
  .controls label {
    font-size: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .controls label span {
    font-size: 0.75rem;
    color: #666;
  }
  .controls .value {
    font-size: 0.8rem;
    min-width: 28px;
    text-align: right;
    margin-left: 4px;
  }
  .counters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.85rem;
    padding: 2px 0;
  }
  .counter {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    min-width: 70px;
    text-align: center;
  }
  .counter .label {
    font-size: 0.7rem;
    color: #666;
    display: block;
  }
  .counter .value {
    font-size: 1rem;
    font-weight: 600;
    display: block;
  }
  .chart-wrap {
    flex: 1;
    min-height: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chart {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
  }
  .chart svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .chart text {
    font: 11px sans-serif;
    fill: #333;
  }
  .chart polyline {
    fill: none;
    stroke-width: 2;
