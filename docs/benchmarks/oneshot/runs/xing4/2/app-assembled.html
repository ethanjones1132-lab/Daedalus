<title>Ecosystem Lab</title>
<style>
/* ===== CSS ===== */
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --panel2: #0f3460;
  --text: #e0e0e0;
  --accent: #53d8fb;
  --rabbit: #f4f4f4;
  --fox: #dc5014;
  --grass: #3c3c3c;
  --border: #2a2a4a;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; justify-content: center; align-items: stretch;
  min-height: 100vh;
}
.container { padding: 16px; }
.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
}
.panel-title { font-size: 14px; color: #aaa; margin-bottom: 6px; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.row label { min-width: 70px; font-size: 12px; color: #bbb; }
.row input[type=range] { width: 140px; }
.row .value { color: var(--accent); font-weight: bold; min-width: 36px; text-align: right; }
.row button { padding: 4px 12px; border: 1px solid #3a3a5a; background: #2a2a4a; color: var(--text); cursor: pointer; border-radius: 4px; font-size: 12px; }
.row button:hover { background: #3a3a6a; }
.row button:active { transform: scale(0.95); }
.row button.play { background: #2a8a3a; border-color: #4aab5a; }
