<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>Ecosystem Lab</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;display:flex;flex-wrap:wrap;min-height:100vh;}
.panel-world{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;}
.panel-side{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;}
canvas{background:#000;}
svg{border:1px solid #ccc;}
button{margin:2px;}
input,textarea{margin:2px;}
label{display:inline-block;margin-right:5px;}
@media(max-width:700px){.panel-side{margin-top:10px;}}
</style>
</head>
<body>
<div class="panel-world">
<canvas data-testid="world"></canvas>
<div>
<label for="seed">Seed:</label><input type="number" id="seed" data-testid="seed" value="42">
<label for="speed">Speed:</label><input type="range" id="speed" data-testid="speed" min="1" max="60" value="10">
<button data-testid="play">Play</button>
<button data-testid="pause">Pause</button>
<button data-testid="step">Step</button>
<button data-testid="reset">Reset</button>
</div>
<div>
<label for="param-rabbits0">Rabbits:</label><input type="range" id="param-rabbits0" data-testid="param-rabbits0" min="0" max="300" value="100"><span id="val-rabbits0">100</span>
<label for="param-foxes0">Foxes:</label><input type="range" id="param-foxes0" data-testid="param-foxes0" min="0" max="60" value="6"><span id="val-foxes0">6</span>
<label for="param-rabbitBreed">Rabbit Breed:</label><input type="range" id="param-rabbitBreed" data-testid="param-rabbitBreed" min="2" max="40" value="12"><span id="val-rabbitBreed">12</span>
<label for="param-foxBreed">Fox Breed:</label><input type="range" id="param-foxBreed" data-testid="param-foxBreed" min="2" max="60" value="40"><span id="val-foxBreed">40</span>
<label for="param-foxGain">Fox Gain:</label><input type="range" id="param-foxGain" data-testid="param-foxGain" min="1" max="30" value="4"><span id="val-foxGain">4</span>
<label for="param-grassMax">Grass Max:</label><input type="range" id="param-grassMax" data-testid="param-grassMax" min="1" max="10" value="4"><span id="val-grassMax">4</span>
</div>
<div>
<span data-testid="tick">0</span> ticks |
<span data-testid="count-rabbits">0</span> rabbits |
<span data-testid="count-foxes">0</span> foxes |
<span data-testid="count-grass">0</span> grass
</div>
<div>
<button data-testid="csv-export">Export CSV</button>
</div>
<div>
<textarea id="scenario-json" data-testid="scenario-json" rows="4" cols="40"></textarea>
<button data-testid="scenario-export">Export Scenario</button>
<button data-testid="scenario-load">Load Scenario</button>
<message id="scenario-error" data-testid="scenario-error"></message>
</div>
<div>
<label for="preset-name">Preset name:</label><input type="text" id="preset-name"><button data-testid="preset-save">Save Preset</button>
<ul id="preset-list" data-testid="preset-list"></ul>
</div>
<div>
<label for="ode-alpha">α:</label><input type="number" id="ode-alpha" data-testid="ode-alpha" step="0.01" value="1.1">
<label for="ode-beta">β:</label><input type="number" id="ode-beta" data-testid="ode-beta" step="0.01" value="0.4">
<label for="ode-gamma">γ:</label><input type="number" id="ode-gamma" data-testid="ode-gamma" step="0.01" value="0.4">
<label for="ode-delta">δ:</label><input type="number" id="ode-delta" data-testid="ode-delta" step="0.01" value="0.1">
<label for="ode-x0">x₀:</label><input type="number" id="ode-x0" data-testid="ode-x0" step="0.1" value="10">
<label for="ode-y0">y₀:</label><input type="number" id="ode-y0" data-testid="ode-y0" step="0.1" value="10">
<label for="ode-t">t:</label><input type="number" id="ode-t" data-testid="ode-t" step="0.1" value="50">
<label for="ode-dt">Δt:</label><input type="number" id="ode-dt" data-testid="ode-dt" step="0.01" value="0.01">
<button data-testid="ode-run">Run ODE</button>
<div>
<span id="ode-x"></span>, <span id="ode-y"></span>
</div>
<div>
<span id="ode-eq-x"></span>, <span id="ode-eq-y"></span>
</div>
<div>
<span id="ode-drift"></span>
</div>
<svg data-testid="ode-chart" width="200" height="200"></svg>
</div>
</div>
<div class="panel-side">
<svg data-testid="chart" width="300" height="200"></svg>
</div>
<div id="announcer" aria-live="polite"></div>
